<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Spacing Scale</title>
<link rel="stylesheet" href="card.css">
<style>
  .scale-row { display: flex; align-items: center; gap: 14px; padding: 5px 0; }
  .scale-row .token { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); min-width: 80px; }
  .scale-row .bar { background: var(--brand-teal); height: 14px; border-radius: 3px; }
  .scale-row .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style>
</head>
<body>
<div class="card">
  <div class="label">Spacing — 4pt grid</div>
  <div class="scale-row"><span class="token">--s-1</span><div class="bar" style="width: 4px"></div><span class="px">4px</span></div>
  <div class="scale-row"><span class="token">--s-2</span><div class="bar" style="width: 8px"></div><span class="px">8px</span></div>
  <div class="scale-row"><span class="token">--s-3</span><div class="bar" style="width: 12px"></div><span class="px">12px</span></div>
  <div class="scale-row"><span class="token">--s-4</span><div class="bar" style="width: 16px"></div><span class="px">16px</span></div>
  <div class="scale-row"><span class="token">--s-5</span><div class="bar" style="width: 24px"></div><span class="px">24px</span></div>
  <div class="scale-row"><span class="token">--s-6</span><div class="bar" style="width: 32px"></div><span class="px">32px</span></div>
  <div class="scale-row"><span class="token">--s-7</span><div class="bar" style="width: 48px"></div><span class="px">48px</span></div>
  <div class="scale-row"><span class="token">--s-8</span><div class="bar" style="width: 64px"></div><span class="px">64px</span></div>
  <div class="scale-row"><span class="token">--s-9</span><div class="bar" style="width: 96px"></div><span class="px">96px</span></div>
</div>
</body>
</html>

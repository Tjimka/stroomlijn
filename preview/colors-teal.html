<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Teal Scale</title>
<link rel="stylesheet" href="card.css">
<style>
  .scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .swatch--scale { height: 90px; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Teal — primary scale</div>
  <div class="scale">
    <div class="swatch swatch--scale swatch--light" style="background: #E4F0F2">
      <div class="swatch__name">Soft</div>
      <div class="swatch__hex">#E4F0F2</div>
    </div>
    <div class="swatch swatch--scale" style="background: #7FB6C0">
      <div class="swatch__name">Light</div>
      <div class="swatch__hex">#7FB6C0</div>
    </div>
    <div class="swatch swatch--scale" style="background: #4899A7">
      <div class="swatch__name">Base</div>
      <div class="swatch__hex">#4899A7</div>
    </div>
    <div class="swatch swatch--scale" style="background: #347684">
      <div class="swatch__name">Deep</div>
      <div class="swatch__hex">#347684</div>
    </div>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Cards</title>
<link rel="stylesheet" href="card.css">
<style>
  body { background: #FAF8F2; }
  .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .ds-card {
    background: #fff; border: 1px solid #E1DED1; border-radius: 16px;
    padding: 20px; box-shadow: 0 2px 6px rgba(26,46,74,0.05);
  }
  .ds-card .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #4899A7; }
  .ds-card h4 { font-size: 18px; font-weight: 600; color: #1A2E4A; margin: 8px 0 6px; }
  .ds-card p { font-size: 14px; color: #45556A; line-height: 1.5; }
  .icn {
    width: 36px; height: 36px; border-radius: 10px;
    background: #E4F0F2; display: flex; align-items: center; justify-content: center;
    color: #4899A7; margin-bottom: 12px;
  }
</style>
</head>
<body>
<div class="card" style="background: transparent">
  <div class="cards-grid">
    <div class="ds-card">
      <div class="icn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M12 22v-6M4.93 4.93l4.24 4.24M14.83 14.83l4.24 4.24M2 12h6M22 12h-6M4.93 19.07l4.24-4.24M14.83 9.17l4.24-4.24"/></svg>
      </div>
      <div class="eyebrow">Workshop</div>
      <h4>AI-basis voor teams</h4>
      <p>Halve dag. Praktisch, met concrete voorbeelden uit jullie werk.</p>
    </div>
    <div class="ds-card">
      <div class="icn" style="background: #F2EADB; color: #BD9766;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <div class="eyebrow" style="color: #BD9766">Implementatie</div>
      <h4>Chatbot op maat</h4>
      <p>We bouwen 'm samen, integreren in jullie tools, en dragen 'm over.</p>
    </div>
  </div>
</div>
</body>
</html>

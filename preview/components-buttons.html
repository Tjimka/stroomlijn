<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<link rel="stylesheet" href="card.css">
<style>
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 10px; font: inherit;
    font-weight: 600; font-size: 15px; border: 1px solid transparent;
    cursor: pointer; transition: all 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .btn-primary { background: #4899A7; color: #fff; }
  .btn-primary:hover { background: #347684; }
  .btn-secondary { background: #fff; color: #1A2E4A; border-color: #E1DED1; }
  .btn-secondary:hover { background: #FAF8F2; border-color: #CFC9B8; }
  .btn-ghost { background: transparent; color: #1A2E4A; }
  .btn-ghost:hover { background: #F0EDE4; }
  .btn-gold { background: #BD9766; color: #fff; }
  .btn-gold:hover { background: #9A7A4E; }
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .row-btn { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 6px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Buttons</div>
  <div class="row-btn">
    <button class="btn btn-primary">Plan kennismaking</button>
    <button class="btn btn-secondary">Meer lezen</button>
    <button class="btn btn-ghost">Annuleer</button>
    <button class="btn btn-gold">Start pilot</button>
  </div>
  <div class="row-btn" style="margin-top: 10px;">
    <button class="btn btn-primary btn-sm">Klein primair</button>
    <button class="btn btn-secondary btn-sm">Klein secundair</button>
    <button class="btn btn-primary" disabled style="opacity: 0.5; cursor: not-allowed;">Uitgeschakeld</button>
  </div>
</div>
</body>
</html>

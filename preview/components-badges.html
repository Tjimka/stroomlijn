<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Badges</title>
<link rel="stylesheet" href="card.css">
<style>
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 9999px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
  }
  .b-dot { width: 6px; height: 6px; border-radius: 50%; }
  .row-b { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 4px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Badges &amp; chips</div>
  <div class="row-b">
    <span class="badge" style="background: #E4F0F2; color: #347684"><span class="b-dot" style="background:#4899A7"></span>Actief</span>
    <span class="badge" style="background: #E4F0E8; color: #2F6B42"><span class="b-dot" style="background:#4A8F5F"></span>Live</span>
    <span class="badge" style="background: #F7EFD9; color: #8A6A20"><span class="b-dot" style="background:#C89A3C"></span>In review</span>
    <span class="badge" style="background: #F5E3DF; color: #8A3B33"><span class="b-dot" style="background:#B8574D"></span>Aandacht</span>
    <span class="badge" style="background: #F0EDE4; color: #55513F">Concept</span>
  </div>
  <div class="row-b" style="margin-top: 8px">
    <span class="badge" style="background: #F2EADB; color: #9A7A4E; border: 1px solid #E0CFA8;">Accent goud</span>
    <span class="badge" style="background: #1A2E4A; color: #fff;">Op donker</span>
    <span class="badge" style="background: transparent; color: #4899A7; border: 1px solid #7FB6C0;">Outline</span>
  </div>
</div>
</body>
</html>

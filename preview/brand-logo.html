<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Logo</title>
<link rel="stylesheet" href="card.css">
<style>
  body { background: #FAF8F2; }
  .logo-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: center; }
  .logo-panel {
    background: #fff; border: 1px solid #E1DED1; border-radius: 12px;
    padding: 28px; display: flex; align-items: center; justify-content: center;
    min-height: 140px;
  }
  .logo-panel.dark { background: #1A2E4A; }
  .logo-panel img { max-width: 100%; height: auto; max-height: 72px; }
  .logo-panel.mark img { max-height: 80px; }
</style>
</head>
<body>
<div class="card" style="background: transparent">
  <div class="logo-grid">
    <div class="logo-panel"><img src="../assets/logo-wordmark.png" alt="STROOMLIJN"></div>
    <div class="logo-panel mark"><img src="../assets/favicon-s-mark.png" alt="S"></div>
  </div>
</div>
</body>
</html>

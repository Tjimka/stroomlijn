<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="card.css">
<style>
  .radii { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .r-box {
    aspect-ratio: 1;
    background: var(--brand-teal);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 8px;
    color: white;
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .r-lbl { text-align: center; font-size: 12px; color: var(--fg-3); margin-top: 6px; font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="card">
  <div class="label">Corner radii</div>
  <div class="radii">
    <div><div class="r-box" style="border-radius: 4px">4px</div><div class="r-lbl">--r-xs</div></div>
    <div><div class="r-box" style="border-radius: 6px">6px</div><div class="r-lbl">--r-sm</div></div>
    <div><div class="r-box" style="border-radius: 10px">10px</div><div class="r-lbl">--r-md</div></div>
    <div><div class="r-box" style="border-radius: 16px">16px</div><div class="r-lbl">--r-lg</div></div>
    <div><div class="r-box" style="border-radius: 24px">24px</div><div class="r-lbl">--r-xl</div></div>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Brand Colors</title>
<link rel="stylesheet" href="card.css">
<style>
  .swatch--brand { height: 120px; }
  .brand-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand-grid">
    <div class="swatch swatch--brand" style="background: #4899A7">
      <div class="swatch__name">Teal</div>
      <div class="swatch__hex">#4899A7 · primary</div>
    </div>
    <div class="swatch swatch--brand" style="background: #BD9766">
      <div class="swatch__name">Warm Goud</div>
      <div class="swatch__hex">#BD9766 · accent</div>
    </div>
    <div class="swatch swatch--brand swatch--light" style="background: #F0EDE4">
      <div class="swatch__name">Zand</div>
      <div class="swatch__hex">#F0EDE4 · canvas</div>
    </div>
    <div class="swatch swatch--brand" style="background: #1A2E4A">
      <div class="swatch__name">Donkerblauw</div>
      <div class="swatch__hex">#1A2E4A · ink</div>
    </div>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Type — Heading Scale</title>
<link rel="stylesheet" href="card.css">
<style>
  .row-type { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border-1); }
  .row-type:last-child { border-bottom: none; }
  .row-type .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); min-width: 110px; }
</style>
</head>
<body>
<div class="card">
  <div class="row-type"><span class="meta">H1 · 48 · 600</span><span style="font-size: 48px; font-weight: 600; letter-spacing: -0.02em;">AI die aansluit</span></div>
  <div class="row-type"><span class="meta">H2 · 36 · 600</span><span style="font-size: 36px; font-weight: 600; letter-spacing: -0.01em;">Training en sprints</span></div>
  <div class="row-type"><span class="meta">H3 · 28 · 600</span><span style="font-size: 28px; font-weight: 600;">Wat we bouwen</span></div>
  <div class="row-type"><span class="meta">H4 · 22 · 600</span><span style="font-size: 22px; font-weight: 600;">Een kleine kop</span></div>
</div>
</body>
</html>

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Gold & Sand Accents</title>
<link rel="stylesheet" href="card.css">
<style>
  .scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .swatch--scale { height: 90px; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Warm accents — goud + zand</div>
  <div class="scale">
    <div class="swatch swatch--scale swatch--light" style="background: #F2EADB">
      <div class="swatch__name">Gold Soft</div>
      <div class="swatch__hex">#F2EADB</div>
    </div>
    <div class="swatch swatch--scale" style="background: #BD9766">
      <div class="swatch__name">Gold</div>
      <div class="swatch__hex">#BD9766</div>
    </div>
    <div class="swatch swatch--scale" style="background: #9A7A4E">
      <div class="swatch__name">Gold Deep</div>
      <div class="swatch__hex">#9A7A4E</div>
    </div>
    <div class="swatch swatch--scale swatch--light" style="background: #E3DECE">
      <div class="swatch__name">Sand Deep</div>
      <div class="swatch__hex">#E3DECE</div>
    </div>
  </div>
</div>
</body>
</html>

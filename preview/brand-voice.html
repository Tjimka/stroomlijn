<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Voice</title>
<link rel="stylesheet" href="card.css">
<style>
  .voice { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .voice-col { border-radius: 10px; padding: 16px; }
  .voice-do { background: #E4F0E8; border: 1px solid #B8D4C1; }
  .voice-dont { background: #F5E3DF; border: 1px solid #E3BFB8; }
  .voice-h { font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; margin-bottom: 10px; }
  .voice-do .voice-h { color: #2F6B42; }
  .voice-dont .voice-h { color: #8A3B33; }
  .voice-ex { font-size: 14px; color: #1A2E4A; line-height: 1.5; margin-bottom: 8px; }
  .voice-ex:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="voice">
    <div class="voice-col voice-do">
      <div class="voice-h">✓ Wel</div>
      <div class="voice-ex">"AI die aansluit op jouw werk."</div>
      <div class="voice-ex">"Geen toeters en bellen. Gewoon bruikbaar."</div>
      <div class="voice-ex">"We pakken het samen op."</div>
    </div>
    <div class="voice-col voice-dont">
      <div class="voice-h">✗ Niet</div>
      <div class="voice-ex">"Revolutioneer je bedrijf met next-gen AI!"</div>
      <div class="voice-ex">"Unlock the full potential 🚀"</div>
      <div class="voice-ex">"Game-changing disruptive solution."</div>
    </div>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Shadows</title>
<link rel="stylesheet" href="card.css">
<style>
  body { background: #FAF8F2; }
  .shadows { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; padding: 16px 0; }
  .sh-box {
    aspect-ratio: 1;
    background: #fff;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-3);
  }
  .sh-lbl { text-align: center; font-size: 12px; color: var(--fg-3); margin-top: 8px; font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="card" style="background: transparent">
  <div class="label">Elevation</div>
  <div class="shadows">
    <div><div class="sh-box" style="box-shadow: 0 1px 2px rgba(26,46,74,0.04)">xs</div><div class="sh-lbl">--shadow-xs</div></div>
    <div><div class="sh-box" style="box-shadow: 0 2px 6px rgba(26,46,74,0.05), 0 1px 2px rgba(26,46,74,0.04)">sm</div><div class="sh-lbl">--shadow-sm</div></div>
    <div><div class="sh-box" style="box-shadow: 0 6px 16px rgba(26,46,74,0.06), 0 2px 4px rgba(26,46,74,0.04)">md</div><div class="sh-lbl">--shadow-md</div></div>
    <div><div class="sh-box" style="box-shadow: 0 14px 32px rgba(26,46,74,0.08), 0 4px 8px rgba(26,46,74,0.04)">lg</div><div class="sh-lbl">--shadow-lg</div></div>
    <div><div class="sh-box" style="box-shadow: 0 24px 56px rgba(26,46,74,0.10)">xl</div><div class="sh-lbl">--shadow-xl</div></div>
  </div>
</div>
</body>
</html>

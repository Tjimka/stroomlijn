<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Neutrals</title>
<link rel="stylesheet" href="card.css">
<style>
  .scale { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .swatch--scale { height: 78px; padding: 8px; }
  .swatch__name { font-size: 11px; }
  .swatch__hex { font-size: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Neutrals — warm, gestemd op zand</div>
  <div class="scale">
    <div class="swatch swatch--scale swatch--light" style="background: #FAF8F2"><div class="swatch__name">50</div><div class="swatch__hex">#FAF8F2</div></div>
    <div class="swatch swatch--scale swatch--light" style="background: #F0EDE4"><div class="swatch__name">100</div><div class="swatch__hex">#F0EDE4</div></div>
    <div class="swatch swatch--scale swatch--light" style="background: #E3DECE"><div class="swatch__name">200</div><div class="swatch__hex">#E3DECE</div></div>
    <div class="swatch swatch--scale swatch--light" style="background: #CFC9B8"><div class="swatch__name">300</div><div class="swatch__hex">#CFC9B8</div></div>
    <div class="swatch swatch--scale" style="background: #A8A294"><div class="swatch__name">400</div><div class="swatch__hex">#A8A294</div></div>
    <div class="swatch swatch--scale" style="background: #7A7567"><div class="swatch__name">500</div><div class="swatch__hex">#7A7567</div></div>
    <div class="swatch swatch--scale" style="background: #55513F"><div class="swatch__name">600</div><div class="swatch__hex">#55513F</div></div>
    <div class="swatch swatch--scale" style="background: #3C3A2E"><div class="swatch__name">700</div><div class="swatch__hex">#3C3A2E</div></div>
    <div class="swatch swatch--scale" style="background: #1A2E4A"><div class="swatch__name">900</div><div class="swatch__hex">#1A2E4A</div></div>
  </div>
</div>
</body>
</html>

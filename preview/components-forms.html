<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Form inputs</title>
<link rel="stylesheet" href="card.css">
<style>
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: #1A2E4A; }
  .input {
    padding: 10px 14px; border-radius: 10px; border: 1px solid #E1DED1;
    background: #fff; font: inherit; font-size: 15px; color: #1A2E4A;
    transition: all 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .input:focus { outline: none; border-color: #4899A7; box-shadow: 0 0 0 3px rgba(72,153,167,0.25); }
  .input::placeholder { color: #8A96A5; }
  .grid-f { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  textarea.input { min-height: 72px; resize: vertical; font-family: inherit; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Form inputs</div>
  <div class="grid-f">
    <div class="field"><label>Naam</label><input class="input" placeholder="Jouw naam" value="Rients Dijkstra"></div>
    <div class="field"><label>E-mail</label><input class="input" placeholder="jij@bedrijf.nl"></div>
  </div>
  <div class="field" style="margin-top: 14px"><label>Waar loop je tegenaan?</label><textarea class="input" placeholder="Beschrijf kort je situatie…"></textarea></div>
</div>
</body>
</html>
